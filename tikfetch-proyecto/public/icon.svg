<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#fe2c55" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#25f4ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#fe2c55" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Subtle inner ambient halo -->
  <circle cx="256" cy="256" r="180" fill="url(#neonRose)" opacity="0.08" />

  <!-- Offset Cyan Shadow Mark (TikTok chromatic aberration aesthetic) -->
  <g transform="translate(-6, -4)" opacity="0.8">
    <path d="M256 128 V304 M192 248 L256 312 L320 248" fill="none" stroke="url(#neonCyan)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 352 H352" fill="none" stroke="url(#neonCyan)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- Main Neon Rose Mark -->
  <g filter="url(#glow)" transform="translate(4, 4)">
    <path d="M256 128 V304 M192 248 L256 312 L320 248" fill="none" stroke="url(#neonRose)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 352 H352" fill="none" stroke="url(#neonRose)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- Foreground crisp white stroke -->
  <g>
    <path d="M256 128 V304 M192 248 L256 312 L320 248" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 352 H352" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
